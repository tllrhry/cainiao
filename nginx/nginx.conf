# =============================================n# Cainiao Design - Nginx Production Configurationn# Port 80 entry pointn# =============================================n
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Basic optimizations
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;  # Allow large image uploads

    server {
        listen 80;
        server_name localhost;

        # ---------- Backend API (FastAPI) ----------
        location /api/ {
            proxy_pass http://host.containers.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Static files served by backend ----------
        location /static/ {
            proxy_pass http://host.containers.internal:8000;
            proxy_set_header Host $host;
        }

        location /uploads/ {
            proxy_pass http://host.containers.internal:8000;
            proxy_set_header Host $host;
        }

        # ---------- Health check ----------
        location /health {
            proxy_pass http://host.containers.internal:8000/api/health;
        }

        # ---------- Frontend (Production static files) ----------
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root   /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
