# =============================================
# 菜鸟设计 - Nginx 反向代理配置
# 端口 80 统一入口
# =============================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # 基础优化
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;  # 允许上传较大图片

    server {
        listen 80;
        server_name localhost;

        # ---------- 后端 API（FastAPI） ----------
        location /api/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 上传文件
        location /uploads/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
        }

        # ---------- 健康检查 ----------
        location /health {
            proxy_pass http://host.docker.internal:8000/api/health;
        }

        # ---------- 前端（Vite 开发服务器 / 生产静态文件） ----------
        location / {
            proxy_pass http://host.docker.internal:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;        # WebSocket（Vite HMR）
            proxy_set_header Connection "upgrade";          # WebSocket（Vite HMR）
        }
    }
}
